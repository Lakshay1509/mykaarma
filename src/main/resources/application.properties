spring.application.name=appointment-reminders

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reminders}
spring.datasource.username=${DB_USER:reminders}
spring.datasource.password=${DB_PASSWORD:reminders}

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# REST API: nothing renders a view, so holding a DB connection that long is pure waste.
spring.jpa.open-in-view=false

# Flyway owns the schema. Hibernate only checks at startup that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# By default Jackson converts every OffsetDateTime to UTC while parsing. The service
# needs the client's original offset to check it against the dealership's timezone.
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false

# One JAR, two roles (§3): worker nodes set this to true to run the dispatcher.
app.worker.enabled=false

# Sends each worker lets run at once, per provider (§6.4). Going over the provider's limit
# gets a burst of 429s, and those rows would all retry at about the same moment.
# Each worker only limits itself, so set these to the account's limit divided by the
# number of workers. Keep 200 / cap x the slowest send under 60s: a send still waiting
# for a slot when its lease runs out is handed to another worker.
# ponytail: SES limits emails per second, not in flight. A cap only approximates that
# (rate ≈ cap / latency). Add a rate limiter for email if SES starts throttling.
app.sender.max-in-flight.sms=20
app.sender.max-in-flight.email=20

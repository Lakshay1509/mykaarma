services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reminders
      POSTGRES_USER: reminders
      POSTGRES_PASSWORD: reminders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminders"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DB_HOST: postgres
      SPRING_PROFILES_ACTIVE: dev   # loads the demo dealerships
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
